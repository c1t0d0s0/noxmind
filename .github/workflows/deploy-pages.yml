name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

# Grant GITHUB_TOKEN permissions required to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci || npm install

      - name: Inject GTM_ID from repository variable if available
        env:
          GTM_ID_VAR: ${{ vars.GTM_ID }}
          GTM_ID_SECRET: ${{ secrets.GTM_ID }}
        run: |
          GTM_ID="${GTM_ID_VAR:-$GTM_ID_SECRET}"
          if [ -n "$GTM_ID" ]; then
            echo "const GTM_ID = '$GTM_ID';" > config.js
            echo "Generated config.js with GTM_ID from repository variable/secret"
          else
            echo "const GTM_ID = '';" > config.js
            echo "GTM_ID is not configured, generated empty config.js"
          fi

      - name: Build www assets
        run: npm run build:assets

      - name: Create .nojekyll
        run: touch www/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'www'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
